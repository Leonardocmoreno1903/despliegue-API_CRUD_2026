<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Actualizar Usuario</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h2>ACTUALIZAR USUARIO</h2>

      <form id="actualizar-usuario-form">
        <!-- ID OCULTO -->
        <input type="hidden" id="id" />

        <div class="mb-3">
          <label for="nombre" class="form-label">NOMBRE</label>

          <input type="text" class="form-control" id="nombre" required />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">EMAIL</label>

          <input type="email" class="form-control" id="email" required />
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">CONTRASEÑA</label>

          <input type="text" class="form-control" id="contrasena" required />
        </div>

        <button type="submit" class="btn btn-primary">
          ACTUALIZAR USUARIO
        </button>

        <a href="AdministrarUsuario.html" class="btn btn-info"> VOLVER </a>
      </form>
    </div>

    <script>
      // URL DE LA API EN RAILWAY
      const API_URL =
        "https://despliegue-apicrud2026-production.up.railway.app";

      // OBTENER EL ID QUE VIENE EN LA URL
      const idUsuario = new URLSearchParams(window.location.search).get("id");

      // CARGAR LOS DATOS DEL USUARIO
      document.addEventListener("DOMContentLoaded", function () {
        if (!idUsuario) {
          alert("No se encontró el ID del usuario");

          window.location.href = "AdministrarUsuario.html";

          return;
        }

        fetch(`${API_URL}/usuario/${idUsuario}`)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Error al obtener el usuario");
            }

            return response.json();
          })

          .then((data) => {
            console.log("Usuario recibido:", data);

            document.getElementById("id").value = data[0];

            document.getElementById("nombre").value = data[1];

            document.getElementById("email").value = data[2];

            document.getElementById("contrasena").value = data[3];
          })

          .catch((error) => {
            console.error("Error al cargar usuario:", error);

            alert("No fue posible cargar el usuario");
          });
      });

      // ACTUALIZAR EL USUARIO
      document
        .getElementById("actualizar-usuario-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const id = document.getElementById("id").value;

          const nombre = document.getElementById("nombre").value;

          const email = document.getElementById("email").value;

          const contrasena = document.getElementById("contrasena").value;

          fetch(`${API_URL}/actualizar_usuario/${id}`, {
            method: "PUT",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              nombre: nombre,
              email: email,
              contrasena: contrasena,
            }),
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error("Error al actualizar usuario");
              }

              return response.json();
            })

            .then((data) => {
              alert(data.mensaje);

              window.location.href = "AdministrarUsuario.html";
            })

            .catch((error) => {
              console.error("Error al actualizar usuario:", error);

              alert("No fue posible actualizar el usuario");
            });
        });
    </script>
  </body>
</html>
