<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumir API de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h2>CREAR NUEVO USUARIO</h2>
        <form id="crear-usuario-form">
            <div class="form-group">
                <label for="nombre">NOMBRE</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">EMAIL</label>
                <input type="text" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="contrasena">CONTRASEÑA</label>
                <input type="text" class="form-control" id="contrasena" required>
            </div>
            <button type="submit" class="btn btn-primary">CREAR USUARIO</button>
            <a href="AdministrarUsuario.html" class="btn btn-info">VOLVER</a>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            document.getElementById('crear-usuario-form').addEventListener('submit', function(event){
                event.preventDefault();
                const nombre = document.getElementById('nombre').value;
                const email = document.getElementById('email').value;
                const contrasena = document.getElementById('contrasena').value;
                fetch('http://127.0.0.1:5000/nuevo_usuario',{
                    method:"POST",
                    headers:{
                        'Content-Type': 'application/json'
                    },
                    body:JSON.stringify({nombre: nombre, email:email, contrasena: contrasena})
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.mensaje);
                    window.location.href = 'AdministrarUsuario.html'
                })
                .catch(error => console.error('Error al crear usuario', error));
            });
        });
    </script>
    
</body>
</html>
